name: sakekeep-production

x-build: &app-build
  context: .
  args:
    VITE_SAKEKEEP_DEMO_MODE: "false"
    VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY}
    VITE_POSTHOG_PROJECT_TOKEN: ${VITE_POSTHOG_PROJECT_TOKEN:-}

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with a percent-encoded password}
  S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
  S3_REGION: ${S3_REGION:?Set S3_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
  SHARE_TOKEN_SECRET: ${SHARE_TOKEN_SECRET:?Set SHARE_TOKEN_SECRET}
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
  VITE_SAKEKEEP_DEMO_MODE: "false"
  VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
  POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
  VITE_POSTHOG_PROJECT_TOKEN: ${VITE_POSTHOG_PROJECT_TOKEN:-}

services:
  app:
    build:
      <<: *app-build
      target: runtime
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/api/health');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  migrate:
    build:
      <<: *app-build
      target: migrate
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "db:migrate"]
    restart: "no"

  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: sakekeep
      POSTGRES_USER: sakekeep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakekeep -d sakekeep"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
