services:
  app:
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
    depends_on:
      rustfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:33000:3000"

  migrate:
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1

  rustfs-permissions:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    user: root
    volumes:
      - rustfs-data:/fix/data
      - rustfs-logs:/fix/logs
    command: ["sh", "-c", "chown -R 10001:10001 /fix/data /fix/logs"]
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest@sha256:3c2d55977829620284ece8593901bf776bcfc0fc9972784352de4dcffdb92416
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    command: ["/data"]
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  rustfs-data:
  rustfs-logs:
