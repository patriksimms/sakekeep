services:
  app:
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      # The shipped image verifies real signed JWTs; only the account provider behind it is
      # local, so the smoke needs no Clerk tenant and no test account credentials.
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:?Set CLERK_JWT_KEY}
      CLERK_API_URL: http://clerk-fixture:3100
    depends_on:
      rustfs:
        condition: service_healthy
      clerk-fixture:
        condition: service_healthy
    ports:
      - "127.0.0.1:33000:3000"

  migrate:
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      CLERK_API_URL: http://clerk-fixture:3100

  clerk-fixture:
    image: ${BUN_IMAGE:-oven/bun:1.4.5-slim@sha256:b780593f3e10918cbdaec3d5a08d52224b9198069a65eb47812085c2ec007643}
    working_dir: /fixture
    environment:
      SAKEKEEP_CLERK_FIXTURE_PORT: "3100"
      SAKEKEEP_CLERK_FIXTURE_HOST: "0.0.0.0"
    volumes:
      - ./e2e/fixtures:/fixture:ro
    command: ["bun", "run", "clerk-backend.ts"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "process.exit((await fetch(''http://127.0.0.1:3100/health'')).ok?0:1)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  rustfs-permissions:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    user: root
    volumes:
      - rustfs-data:/fix/data
      - rustfs-logs:/fix/logs
    command: ["sh", "-c", "chown -R 10001:10001 /fix/data /fix/logs"]
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest@sha256:69bd3c4d8d79b74723bfd68c9fbd9085155d4d4b44a5a136d87502f3075cc68c
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    command: ["/data"]
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  rustfs-data:
  rustfs-logs:
