name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Backstop: a wedged step should not hold a runner for the default six hours.
    timeout-minutes: 30
    env:
      # apt runs inside `playwright install --with-deps`; without these it can block forever
      # on a debconf or needrestart prompt instead of failing.
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
      DATABASE_URL: postgresql://sakekeep:sakekeep@127.0.0.1:54321/sakekeep
      S3_ENDPOINT: http://127.0.0.1:19000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: sakekeep
      S3_SECRET_ACCESS_KEY: sakekeep-local-only
      S3_BUCKET: sakekeep
      SHARE_TOKEN_SECRET: sakekeep-ci-share-token-secret-with-at-least-thirty-two-characters
      APP_ORIGIN: http://127.0.0.1:3000
      VITE_SAKEKEEP_DEMO_MODE: "false"
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_c2FrZWtlZXAuY2xlcmsuYWNjb3VudHMk
      CLERK_SECRET_KEY: sk_test_sakekeep_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      # Before compose: its bind mounts create .local/ as root, which would then
      # keep the runner from writing the ICC profile into it.
      - run: bun run setup:icc
      - run: docker compose up -d --wait
      - run: bun run db:migrate
      - run: bun run db:seed
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Hosted runners have hung here for hours with no output. Cap the step so a stuck
      # package install fails fast and can be rerun.
      - name: Install Chromium and its system dependencies
        timeout-minutes: 10
        run: bunx playwright install --with-deps chromium
      - run: bun run verify
      - if: always()
        run: docker compose logs --no-color
