name: sakekeep

services:
  postgres:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: sakekeep
      POSTGRES_USER: sakekeep
      POSTGRES_PASSWORD: sakekeep
    ports:
      - "54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakekeep -d sakekeep"]
      interval: 2s
      timeout: 3s
      retries: 20

  rustfs-permissions:
    image: alpine:3.24@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    user: root
    volumes:
      - ./.local/media:/fix/data
      - ./.local/rustfs-logs:/fix/logs
    command: ["sh", "-c", "chown -R 10001:10001 /fix/data /fix/logs"]

  rustfs:
    image: rustfs/rustfs:latest@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: sakekeep
      RUSTFS_SECRET_KEY: sakekeep-local-only
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    command: ["/data"]
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ./.local/media:/data
      - ./.local/rustfs-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
