name: sakekeep

services:
  postgres:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    environment:
      POSTGRES_DB: sakekeep
      POSTGRES_USER: sakekeep
      POSTGRES_PASSWORD: sakekeep
    ports:
      - "54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakekeep -d sakekeep"]
      interval: 2s
      timeout: 3s
      retries: 20

  rustfs-permissions:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    user: root
    volumes:
      - ./.local/media:/fix/data
      - ./.local/rustfs-logs:/fix/logs
    command: ["sh", "-c", "chown -R 10001:10001 /fix/data /fix/logs"]

  rustfs:
    image: rustfs/rustfs:latest@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: sakekeep
      RUSTFS_SECRET_KEY: sakekeep-local-only
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    command: ["/data"]
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ./.local/media:/data
      - ./.local/rustfs-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
